<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หม่าล่าสามสหาย | สั่งอาหาร</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#30221e;background:#fff8f2}*{box-sizing:border-box}body{margin:0}.hero{background:#a93123;color:white;padding:26px 18px;text-align:center}.hero h1{margin:0;font-size:27px}.hero p{margin:8px 0 0}.wrap{max-width:680px;margin:auto;padding:18px}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 18px #6b302011}h2{font-size:20px;margin:0 0 12px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.name{font-weight:600}.price{color:#a93123;font-size:14px}.controls{display:flex;align-items:center;gap:12px}.controls button{width:35px;height:35px;border:0;border-radius:10px;background:#f2d5c8;font-size:22px}.qty{min-width:17px;text-align:center}label{display:block;font-weight:600;margin:14px 0 7px}input,select,textarea{width:100%;border:1px solid #d7cbc4;border-radius:10px;padding:12px;font:inherit}textarea{min-height:85px}.total{font-size:28px;font-weight:800;text-align:right;color:#a93123}.submit{background:#aa3325;color:white;border:0;border-radius:12px;padding:17px;width:100%;font:700 19px system-ui;cursor:pointer}.submit:disabled{opacity:.5}.msg{margin-top:12px;white-space:pre-wrap;font-weight:600}.small{font-size:12px;color:#73645f}</style></head><body><header class="hero"><h1>🌶️ หม่าล่าสามสหาย</h1><p>เลือกไม้ • เลือกความเผ็ด • ส่งออเดอร์เข้าร้าน</p></header><main class="wrap"><section class="panel"><h2>เลือกเมนูหม่าล่า</h2><div id="menu"></div><p class="small">รายการและราคาตัวอย่าง กรุณาตรวจสอบก่อนเปิดขายจริง</p></section><section class="panel"><h2>สรุปคำสั่งซื้อ</h2><div id="summary">ยังไม่ได้เลือกสินค้า</div><div class="total" id="total">รวม 0 บาท</div></section><form id="form" class="panel"><h2>ข้อมูลลูกค้า</h2><label for="customer">ชื่อลูกค้า *</label><input id="customer" maxlength="80" required placeholder="ชื่อสำหรับรับอาหาร"><label for="phone">เบอร์โทร (ไม่บังคับ)</label><input id="phone" type="tel" inputmode="tel" maxlength="20" placeholder="08xxxxxxxx"><label for="spicy">ระดับความเผ็ด</label><select id="spicy"><option>ไม่เผ็ด</option><option>เผ็ดน้อย</option><option selected>เผ็ดกลาง</option><option>เผ็ดมาก</option></select><label for="note">หมายเหตุ</label><textarea id="note" maxlength="300" placeholder="เช่น ไม่ใส่ผักชี"></textarea><button id="submit" class="submit" type="submit">ส่งคำสั่งซื้อเข้าร้าน</button><div id="message" class="msg" role="status" aria-live="polite"></div></form></main><script>
const catalog=[{id:'pork',name:'หมูสามชั้น',price:15},{id:'chicken',name:'ไก่หมัก',price:10},{id:'meatball',name:'ลูกชิ้นหมู',price:10},{id:'sausage',name:'ไส้กรอกชีส',price:15},{id:'mushroom',name:'เห็ดเข็มทอง',price:10},{id:'crab',name:'ปูอัด',price:10}];const counts=Object.fromEntries(catalog.map(x=>[x.id,0]));const menu=document.getElementById('menu');for(const x of catalog){const row=document.createElement('div');row.className='item';row.innerHTML=`<div><div class="name">${x.name}</div><div class="price">${x.price} บาท/ไม้</div></div><div class="controls"><button type="button" aria-label="ลด ${x.name}">−</button><span class="qty">0</span><button type="button" aria-label="เพิ่ม ${x.name}">+</button></div>`;const [minus,plus]=row.querySelectorAll('button');const qty=row.querySelector('.qty');const change=n=>{counts[x.id]=Math.max(0,Math.min(99,counts[x.id]+n));qty.textContent=counts[x.id];render()};minus.onclick=()=>change(-1);plus.onclick=()=>change(1);menu.appendChild(row)}function render(){const selected=catalog.filter(x=>counts[x.id]);document.getElementById('summary').textContent=selected.length?selected.map(x=>`${x.name} × ${counts[x.id]} = ${x.price*counts[x.id]} บาท`).join(' / '):'ยังไม่ได้เลือกสินค้า';document.getElementById('total').textContent=`รวม ${selected.reduce((s,x)=>s+x.price*counts[x.id],0)} บาท`}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('message'),btn=document.getElementById('submit');const items=catalog.filter(x=>counts[x.id]).map(x=>({id:x.id,quantity:counts[x.id]}));if(!items.length){msg.textContent='กรุณาเลือกสินค้าอย่างน้อย 1 ไม้';return}btn.disabled=true;msg.textContent='กำลังส่งออเดอร์...';try{const res=await fetch('/.netlify/functions/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,customer:document.getElementById('customer').value.trim(),phone:document.getElementById('phone').value.trim(),spicy:document.getElementById('spicy').value,note:document.getElementById('note').value.trim()})});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||`ระบบขัดข้อง (${res.status})`);msg.textContent=`✅ ส่งคำสั่งซื้อเข้าร้านสำเร็จ\nเลขที่ออเดอร์: ${data.orderId}`;for(const x of catalog)counts[x.id]=0;for(const el of document.querySelectorAll('.qty'))el.textContent='0';render();document.getElementById('form').reset()}catch(err){msg.textContent='❌ ส่งไม่สำเร็จ: '+err.message+'\nกรุณาติดต่อร้านก่อนสั่งซ้ำ'}finally{btn.disabled=false}});</script></body></html>
