<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>มาลา ซัม ซา ไฮ | สั่งหม่าล่า</title><style>body{font-family:system-ui,sans-serif;background:#fff8f1;color:#2b211c;margin:0}header{background:#b8291e;color:white;padding:22px 18px;text-align:center}main{max-width:650px;margin:auto;padding:16px}.note{font-size:13px;color:#715f52}.item{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.controls{display:flex;align-items:center;gap:12px}button{border:0;border-radius:9px;padding:9px 14px;background:#b8291e;color:white;font-size:17px}button:disabled{opacity:.4}.cart{background:white;border-radius:16px;padding:16px;margin-top:20px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:7px 0 14px;font:inherit}.primary{width:100%;padding:15px}.total{font-size:24px;font-weight:700}.price{color:#8c3e26}</style></head><body><header><h1>🌶️ มาลา ซัม ซา ไฮ</h1><div>เลือกไม้ที่ชอบ แล้วสรุปยอดได้ทันที</div></header><main><p class="note">เมนูและราคาเป็นข้อมูลตัวอย่าง กรุณาแก้ให้ตรงกับร้านก่อนเปิดรับออเดอร์จริง</p><section id="menu"></section><section class="cart"><h2>🛒 ตะกร้าสินค้า</h2><div id="summary">ยังไม่มีสินค้า</div><p class="total" id="total">รวม 0 บาท</p><label>ชื่อลูกค้า<input id="customer" placeholder="ชื่อลูกค้า"></label><label>เบอร์โทร (ไม่บังคับ)<input id="phone" type="tel" placeholder="เบอร์โทร"></label><label>ระดับความเผ็ด<select id="spice"><option>ไม่เผ็ด</option><option>เผ็ดน้อย</option><option selected>เผ็ดกลาง</option><option>เผ็ดมาก</option></select></label><label>หมายเหตุ<textarea id="notes" rows="2" placeholder="เช่น ไม่ใส่ผักชี"></textarea></label><button class="primary" id="order">สรุปและคัดลอกคำสั่งซื้อ</button><p class="note" id="status">เวอร์ชันเริ่มต้น: คัดลอกออเดอร์เพื่อส่งในแชต LINE ด้วยตนเอง ยังไม่มีระบบส่งออเดอร์อัตโนมัติ</p></section></main><script>const products=[{name:'หมูสามชั้น',price:15},{name:'ไก่หมัก',price:10},{name:'ลูกชิ้นหมู',price:10},{name:'ไส้กรอกชีส',price:15},{name:'เห็ดเข็มทอง',price:10},{name:'ปูอัด',price:10}];const qty=products.map(()=>0);const menu=document.getElementById('menu');function render(){menu.innerHTML=products.map((p,i)=>`<div class="item"><div><strong>${p.name}</strong><div class="price">${p.price} บาท/ไม้</div></div><div class="controls"><button data-i="${i}" data-d="-1" ${qty[i]===0?'disabled':''}>−</button><b>${qty[i]}</b><button data-i="${i}" data-d="1">+</button></div></div>`).join('');let lines=products.map((p,i)=>qty[i]?`${p.name} × ${qty[i]} = ${p.price*qty[i]} บาท`:null).filter(Boolean);document.getElementById('summary').textContent=lines.join(' / ')||'ยังไม่มีสินค้า';document.getElementById('total').textContent='รวม '+products.reduce((s,p,i)=>s+p.price*qty[i],0)+' บาท';}menu.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const i=Number(b.dataset.i);qty[i]=Math.max(0,qty[i]+Number(b.dataset.d));render()});document.getElementById('order').onclick=async()=>{const selected=products.map((p,i)=>qty[i]?`${p.name} ${qty[i]} ไม้ — ${p.price*qty[i]} บาท`:null).filter(Boolean);if(!selected.length){alert('กรุณาเลือกสินค้า');return}const name=document.getElementById('customer').value.trim();if(!name){alert('กรุณากรอกชื่อลูกค้า');return}const total=products.reduce((s,p,i)=>s+p.price*qty[i],0);const msg=`🌶️ ออเดอร์ มาลา ซัม ซา ไฮ\nลูกค้า: ${name}\nโทร: ${document.getElementById('phone').value.trim()||'-'}\n${selected.join('\n')}\nระดับเผ็ด: ${document.getElementById('spice').value}\nหมายเหตุ: ${document.getElementById('notes').value.trim()||'-'}\nยอดรวม: ${total} บาท`;try{await navigator.clipboard.writeText(msg);document.getElementById('status').textContent='คัดลอกแล้ว! เปิดแชต LINE ร้านและวางข้อความเพื่อส่งออเดอร์'}catch{window.prompt('คัดลอกข้อความนี้ไปส่งให้ร้านใน LINE',msg)}};render();</script></body></html>
