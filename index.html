<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>หม่าล่าสามสหาย | สั่งอาหารออนไลน์</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f2;
      color: #30221e;
    }

    header {
      background: #a93123;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-bottom: 0;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
      color: #a93123;
      font-size: 21px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-weight: bold;
    }

    .price {
      color: #a93123;
      margin-top: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quantity button {
      background: #f2d5c8;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      font-size: 22px;
      cursor: pointer;
    }

    .quantity span {
      min-width: 18px;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    .total {
      text-align: right;
      color: #a93123;
      font-size: 26px;
      font-weight: bold;
      margin-top: 15px;
    }

    .submit {
      background: #a93123;
      color: white;
      border: none;
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .note {
      color: #777;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌶️ หม่าล่าสามสหาย</h1>
  <p>เลือกไม้ • เลือกความเผ็ด • ส่งออเดอร์เข้าร้าน</p>
</header>

<div class="container">

  <div class="box">
    <h2>🍢 เลือกเมนูหม่าล่า</h2>
    <div id="menu"></div>
    <p class="note">
      รายการและราคาเป็นข้อมูลตัวอย่าง กรุณาตรวจสอบก่อนเปิดขายจริง
    </p>
  </div>

  <div class="box">
    <h2>🛒 สรุปคำสั่งซื้อ</h2>
    <div id="summary">ยังไม่ได้เลือกสินค้า</div>
    <div class="total" id="total">รวม 0 บาท</div>
  </div>

  <form id="orderForm" class="box">

    <h2>📝 ข้อมูลลูกค้า</h2>

    <label for="customer">ชื่อลูกค้า *</label>
    <input
      type="text"
      id="customer"
      maxlength="80"
      required
      placeholder="กรอกชื่อลูกค้า"
    >

    <label for="phone">เบอร์โทรศัพท์ (ไม่บังคับ)</label>
    <input
      type="tel"
      id="phone"
      maxlength="20"
      placeholder="08xxxxxxxx"
    >

    <label for="spicy">🌶️ ระดับความเผ็ด</label>
    <select id="spicy">
      <option value="ไม่เผ็ด">ไม่เผ็ด</option>
      <option value="เผ็ดน้อย">เผ็ดน้อย</option>
      <option value="เผ็ดกลาง" selected>เผ็ดกลาง</option>
      <option value="เผ็ดมาก">เผ็ดมาก</option>
    </select>

    <label for="note">หมายเหตุเพิ่มเติม</label>
    <textarea
      id="note"
      maxlength="300"
      placeholder="เช่น ไม่ใส่ผักชี"
    ></textarea>

    <button
      type="submit"
      class="submit"
      id="submitBtn"
    >
      📩 ส่งคำสั่งซื้อเข้าร้าน
    </button>

    <div id="message" role="status" aria-live="polite"></div>

  </form>

</div>

<script>

  // ==========================
  // รายการสินค้า
  // ==========================

  const products = [
    { id: "pork", name: "หมูสามชั้น", price: 15 },
    { id: "chicken", name: "ไก่หมัก", price: 10 },
    { id: "meatball", name: "ลูกชิ้นหมู", price: 10 },
    { id: "sausage", name: "ไส้กรอกชีส", price: 15 },
    { id: "mushroom", name: "เห็ดเข็มทอง", price: 10 },
    { id: "crab", name: "ปูอัด", price: 10 }
  ];

  const cart = {};

  products.forEach(product => {
    cart[product.id] = 0;
  });

  const menu = document.getElementById("menu");

  // ==========================
  // แสดงรายการสินค้า
  // ==========================

  function displayMenu() {

    menu.innerHTML = "";

    products.forEach(product => {

      const row = document.createElement("div");
      row.className = "item";

      row.innerHTML = `
        <div>
          <div class="item-name">${product.name}</div>
          <div class="price">${product.price} บาท/ไม้</div>
        </div>

        <div class="quantity">
          <button type="button" class="minus">−</button>
          <span class="count">${cart[product.id]}</span>
          <button type="button" class="plus">+</button>
        </div>
      `;

      row.querySelector(".minus").addEventListener("click", () => {
        changeQuantity(product.id, -1);
      });

      row.querySelector(".plus").addEventListener("click", () => {
        changeQuantity(product.id, 1);
      });

      menu.appendChild(row);

    });

  }

  // ==========================
  // เพิ่มลดจำนวนสินค้า
  // ==========================

  function changeQuantity(id, amount) {

    cart[id] = Math.max(
      0,
      Math.min(99, cart[id] + amount)
    );

    displayMenu();
    updateSummary();

  }

  // ==========================
  // คำนวณราคารวม
  // ==========================

  function updateSummary() {

    let total = 0;
    let summary = [];

    products.forEach(product => {

      const quantity = cart[product.id];

      if (quantity > 0) {

        const subtotal = quantity * product.price;

        total += subtotal;

        summary.push(
          `${product.name} × ${quantity} = ${subtotal} บาท`
        );

      }

    });

    document.getElementById("summary").textContent =
      summary.length
        ? summary.join("\n")
        : "ยังไม่ได้เลือกสินค้า";

    document.getElementById("summary").style.whiteSpace = "pre-line";

    document.getElementById("total").textContent =
      `รวม ${total} บาท`;

  }

  // ==========================
  // ส่งคำสั่งซื้อ
  // ==========================

  document.getElementById("orderForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      const customer = document.getElementById("customer").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const spicy = document.getElementById("spicy").value;
      const note = document.getElementById("note").value.trim();

      const items = products
        .filter(product => cart[product.id] > 0)
        .map(product => ({
          name: product.name,
          qty: cart[product.id],
          id: product.id,
          quantity: cart[product.id]
        }));

      if (!customer) {
        message.textContent = "❌ กรุณากรอกชื่อลูกค้า";
        return;
      }

      if (items.length === 0) {
        message.textContent = "❌ กรุณาเลือกสินค้าอย่างน้อย 1 ไม้";
        return;
      }

      submitBtn.disabled = true;
      message.textContent = "⏳ กำลังส่งคำสั่งซื้อ...";

      try {

        const response = await fetch(
          "/.netlify/functions/order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              customer: customer,
              customerName: customer,
              name: customer,
              phone: phone,
              spicy: spicy,
              spice: spicy,
              note: note,
              items: items
            })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error ||
            `ระบบขัดข้อง (${response.status})`
          );
        }

        message.textContent =
          "✅ ส่งคำสั่งซื้อเข้าร้านสำเร็จ!\n" +
          "เลขที่ออเดอร์: " + (data.orderId || "-");

        // ล้างตะกร้าเมื่อส่งสำเร็จ
        products.forEach(product => {
          cart[product.id] = 0;
        });

        displayMenu();
        updateSummary();

        document.getElementById("orderForm").reset();

      } catch (error) {

        message.textContent =
          "❌ ส่งไม่สำเร็จ: " +
          error.message +
          "\nกรุณาติดต่อร้านก่อนสั่งซ้ำ";

      } finally {

        submitBtn.disabled = false;

      }

    });

  // ==========================
  // เริ่มต้นเว็บไซต์
  // ==========================

  displayMenu();
  updateSummary();

</script>

</body>
</html>
